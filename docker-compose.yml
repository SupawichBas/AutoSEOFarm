name: shopee-affiliate-seo-farm

services:
  # 1. DATABASE: PostgreSQL 16
  postgres-db:
    image: postgres:16-alpine
    container_name: affiliate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-affiliate_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-StrongPass123!}
      POSTGRES_DB: ${DB_NAME:-affiliate_seo_db}
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - affiliate-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-affiliate_admin} -d ${DB_NAME:-affiliate_seo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BACKEND: .NET Web API & Queue Manager
  dotnet-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affiliate-dotnet-api
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Bangkok
      ConnectionStrings__DefaultConnection: "Host=postgres-db;Port=5432;Database=${DB_NAME:-affiliate_seo_db};Username=${DB_USER:-affiliate_admin};Password=${DB_PASSWORD:-StrongPass123!}"
    ports:
      - "5000:8080"
    networks:
      - affiliate-net

  # 3. BOT WORKER: สคริปต์บอทตรวจสอบคิวและโพสต์อัตโนมัติ
  bot-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: affiliate-bot-worker
    restart: unless-stopped
    depends_on:
      - dotnet-api
    environment:
      TZ: Asia/Bangkok
      WORKER_NAME: "blogger-poster-node-01"
      API_BASE_URL: "http://dotnet-api:8080"
      POLL_INTERVAL_SECONDS: "30"
    networks:
      - affiliate-net

  # 4. FRONTEND: Dashboard UI สำหรับจัดการคีย์เวิร์ดและดูสถิติ
  angular-dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: affiliate-angular-ui
    restart: unless-stopped
    depends_on:
      - dotnet-api
    environment:
      TZ: Asia/Bangkok
    ports:
      - "4200:80"
    networks:
      - affiliate-net

networks:
  affiliate-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
